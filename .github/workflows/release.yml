name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  build:
    needs: test
    # Pushes to main only run the tests; the full three-platform build runs for tags
    # (releases), pull requests and manual runs, so a release isn't built twice.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-22.04 # older glibc = runs on more distros
            name: linux-x64
          - os: macos-latest
            name: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release
          mkdir dist
          cp target/release/underkeeper.exe dist/Underkeeper.exe

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          mkdir dist
          cp target/release/underkeeper dist/underkeeper
          chmod +x dist/underkeeper

      - name: Build (macOS universal .app)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          APP=dist/Underkeeper.app/Contents
          mkdir -p "$APP/MacOS"
          lipo -create -output "$APP/MacOS/underkeeper" \
            target/x86_64-apple-darwin/release/underkeeper \
            target/aarch64-apple-darwin/release/underkeeper
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          sed "s/VERSION/$VERSION/g" packaging/Info.plist > "$APP/Info.plist"
          codesign --force --deep -s - dist/Underkeeper.app
          cd dist && ditto -c -k --keepParent Underkeeper.app Underkeeper-macos-universal.zip && rm -rf Underkeeper.app

      - uses: actions/upload-artifact@v7
        with:
          name: underkeeper-${{ matrix.name }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match Cargo.toml version
        # The updater compares the release tag with the version built into the app.
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Package
        run: |
          mkdir out
          cp artifacts/underkeeper-windows-x64/Underkeeper.exe out/Underkeeper-windows-x64.exe
          tar -C artifacts/underkeeper-linux-x64 -czf out/underkeeper-linux-x64.tar.gz underkeeper
          cp artifacts/underkeeper-macos-universal/Underkeeper-macos-universal.zip out/
      - uses: softprops/action-gh-release@v3
        with:
          files: out/*
          generate_release_notes: true
